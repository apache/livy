apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "livycluster.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "livycluster.name" . }}
    helm.sh/chart: {{ include "livycluster.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceName: {{ include "livycluster.fullname" . }}-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "livycluster.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "livycluster.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "livycluster.fullname" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.livy.repository }}:{{ include "livycluster.livyImageTag" . }}"
          imagePullPolicy: {{ .Values.image.livy.pullPolicy }}
          ports:
            - name: http
              containerPort: 8998
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: HTTP2_DISABLE
              value: "true"
            - name: LIVY_CONF_DIR
              value: "/conf"
            - name: SPARK_CONF_DIR
              value: "/conf"
            - name: LIVY_LOG_DIR
              value: "/opt/livy/logs"
            {{- $javaOpts := include "livycluster.serverJavaOpts" . }}
            {{- if $javaOpts }}
            - name: LIVY_SERVER_JAVA_OPTS
              value: {{ $javaOpts | quote }}
            {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: livy-store
              mountPath: /tmp/livy/store
              {{- if .Values.persistence.subPath }}
              subPath: {{ .Values.persistence.subPath }}
              {{- end }}
            {{- end }}
            - name: cluster-conf-cm
              mountPath: /conf
      volumes:
        - name: cluster-conf-cm
          configMap:
            name: {{ include "livycluster.fullname" . }}-config
        - name: livy-store
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "livycluster.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "livycluster.fullname" . }}-history
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "livycluster.historyLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "livycluster.fullname" . }}-history
  replicas: 1
  selector:
    matchLabels:
      {{- include "livycluster.historySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "livycluster.historySelectorLabels" . | nindent 8 }}
    spec:
      # Spark History Server requires a resolvable Hadoop user on local K8s clusters
      # that do not provide proper Unix/Hadoop identity mapping.
      securityContext:
        runAsUser: 0
      containers:
        - name: spark-history-server
          image: "{{ .Values.image.spark.repository }}:{{ include "livycluster.sparkImageTag" . }}"
          imagePullPolicy: {{ .Values.image.spark.pullPolicy }}
          env:
            - name: HADOOP_USER_NAME
              value: root
            - name: SPARK_HISTORY_OPTS
              value: "-Dspark.history.fs.logDirectory=file:///tmp/livy/store"
            - name: SPARK_NO_DAEMONIZE
              value: "true"
          command:
            - /opt/spark/sbin/start-history-server.sh
          ports:
            - containerPort: 18080
          volumeMounts:
            - name: spark-history-data
              mountPath: /tmp/livy/store
      volumes:
        - name: spark-history-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "livycluster.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
